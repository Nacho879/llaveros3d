<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="500" height="350" fill="#f8fafc"/>
  
  <!-- Llavero rectangular -->
  <g transform="translate(250,175)" filter="url(#shadow2)">
    <!-- Cuerpo principal -->
    <rect x="-90" y="-50" width="180" height="100" rx="18" fill="url(#bg2)"/>
    
    <!-- Agujero del llavero -->
    <circle cx="0" cy="-65" r="15" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Logo/Texto de ejemplo -->
    <text x="0" y="8" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">EMPRESA</text>
    
    <!-- Detalles 3D -->
    <rect x="-75" y="-35" width="150" height="70" rx="12" fill="rgba(255,255,255,0.1)"/>
  </g>
  
  <!-- Texto descriptivo -->
  <text x="250" y="320" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Llavero Rectangular - Estilo Profesional</text>
</svg>
