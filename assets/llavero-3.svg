<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="500" height="350" fill="#f8fafc"/>
  
  <!-- Llavero píldora -->
  <g transform="translate(250,175)" filter="url(#shadow3)">
    <!-- Cuerpo principal -->
    <rect x="-100" y="-45" width="200" height="90" rx="45" fill="url(#bg3)"/>
    
    <!-- Agujero del llavero -->
    <circle cx="0" cy="-65" r="15" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Logo/Texto de ejemplo -->
    <text x="0" y="12" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="bold">BRAND</text>
    
    <!-- Detalles 3D -->
    <ellipse cx="0" cy="0" rx="85" ry="30" fill="rgba(255,255,255,0.1)"/>
  </g>
  
  <!-- Texto descriptivo -->
  <text x="250" y="320" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Llavero Píldora - Estilo Moderno</text>
</svg>
