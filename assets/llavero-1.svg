<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="500" height="350" fill="#f8fafc"/>
  
  <!-- Llavero redondo -->
  <g transform="translate(250,175)" filter="url(#shadow)">
    <!-- Cuerpo principal -->
    <circle cx="0" cy="0" r="100" fill="url(#bg)"/>
    
    <!-- Agujero del llavero -->
    <circle cx="0" cy="-70" r="15" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Logo/Texto de ejemplo -->
    <text x="0" y="15" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">LOGO</text>
    
    <!-- Detalles 3D -->
    <circle cx="-25" cy="-25" r="4" fill="rgba(255,255,255,0.3)"/>
    <circle cx="25" cy="25" r="3" fill="rgba(255,255,255,0.2)"/>
  </g>
  
  <!-- Texto descriptivo -->
  <text x="250" y="320" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Llavero Redondo - Estilo Corporativo</text>
</svg>
