<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <pattern id="texture" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M0 0 L20 20 M20 0 L0 20" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Fondo -->
  <rect width="500" height="350" fill="#f8fafc"/>
  
  <!-- Llavero INMOBILIARIA NOVA -->
  <g transform="translate(250,175)" filter="url(#shadow6)">
    <!-- Cuerpo principal del llavero -->
    <rect x="-100" y="-55" width="200" height="110" rx="15" fill="white" stroke="#000000" stroke-width="3"/>
    
    <!-- Textura diagonal sutil -->
    <rect x="-100" y="-55" width="200" height="110" rx="15" fill="url(#texture)"/>
    
    <!-- Agujero del llavero con cadena -->
    <circle cx="-110" cy="-70" r="18" fill="#c0c0c0" stroke="#a0a0a0" stroke-width="2"/>
    
    <!-- Cadena de 3 eslabones -->
    <rect x="-130" y="-85" width="40" height="40" rx="20" fill="none" stroke="#c0c0c0" stroke-width="3"/>
    <rect x="-120" y="-75" width="25" height="25" rx="12.5" fill="none" stroke="#c0c0c0" stroke-width="3"/>
    <rect x="-115" y="-70" width="15" height="15" rx="7.5" fill="none" stroke="#c0c0c0" stroke-width="3"/>
    
    <!-- Icono de casa -->
    <g transform="translate(0,-20)">
      <!-- Tejado de la casa -->
      <path d="M-20,-25 L0,-40 L20,-25 Z" fill="#059669" stroke="#047857" stroke-width="1"/>
      <!-- Cuerpo de la casa -->
      <rect x="-20" y="-25" width="40" height="30" fill="#059669" stroke="#047857" stroke-width="1"/>
      <!-- Puerta/ventana -->
      <rect x="-10" y="-18" width="20" height="18" fill="white" stroke="#047857" stroke-width="1"/>
    </g>
    
    <!-- Texto INMOBILIARIA NOVA -->
    <text x="0" y="20" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="20" font-weight="bold">INMOBILIARIA</text>
    <text x="0" y="45" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="20" font-weight="bold">NOVA</text>
    
    <!-- Efecto 3D embossed -->
    <text x="1" y="21" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="20" font-weight="bold">INMOBILIARIA</text>
    <text x="1" y="46" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="20" font-weight="bold">NOVA</text>
  </g>
  
  <!-- Texto descriptivo -->
  <text x="250" y="320" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Llavero Corporativo - INMOBILIARIA NOVA</text>
</svg>
