<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f87171;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="500" height="350" fill="#f8fafc"/>
  
  <!-- Llavero silueta -->
  <g transform="translate(250,175)" filter="url(#shadow4)">
    <!-- Cuerpo principal -->
    <path d="M-75,-50 L75,-50 L65,25 L40,50 L-40,50 L-65,25 Z" fill="url(#bg4)"/>
    
    <!-- Agujero del llavero -->
    <circle cx="0" cy="-65" r="15" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Silueta interna -->
    <path d="M-50,-25 L50,-25 L45,12 L30,30 L-30,30 L-45,12 Z" fill="rgba(255,255,255,0.2)"/>
    
    <!-- Detalles 3D -->
    <circle cx="-25" cy="0" r="4" fill="rgba(255,255,255,0.4)"/>
    <circle cx="25" cy="0" r="3" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Texto descriptivo -->
  <text x="250" y="320" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Llavero Silueta - Estilo Único</text>
</svg>
