<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="500" height="350" fill="#f8fafc"/>
  
  <!-- Llavero premium -->
  <g transform="translate(250,175)" filter="url(#shadow5)">
    <!-- Cuerpo principal -->
    <rect x="-90" y="-55" width="180" height="110" rx="25" fill="url(#bg5)"/>
    
    <!-- Agujero del llavero -->
    <circle cx="0" cy="-75" r="18" fill="white" stroke="#e2e8f0" stroke-width="3"/>
    
    <!-- Borde premium -->
    <rect x="-90" y="-55" width="180" height="110" rx="25" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
    
    <!-- Logo/Texto de ejemplo -->
    <text x="0" y="8" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">PREMIUM</text>
    
    <!-- Detalles 3D -->
    <circle cx="-35" cy="-25" r="5" fill="rgba(255,255,255,0.4)"/>
    <circle cx="35" cy="25" r="4" fill="rgba(255,255,255,0.3)"/>
    <circle cx="0" cy="35" r="3" fill="rgba(255,255,255,0.2)"/>
  </g>
  
  <!-- Texto descriptivo -->
  <text x="250" y="320" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Llavero Premium - Estilo Exclusivo</text>
</svg>
