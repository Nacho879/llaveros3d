<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pedido</title>
</head>
<body>
    <h1>Test de Pedido</h1>
    
    <form id="testForm">
        <input type="text" id="nombre" placeholder="Nombre" value="Test User">
        <input type="email" id="email" placeholder="Email" value="test@test.com">
        <input type="tel" id="telefono" placeholder="Teléfono" value="+34 600 000 000">
        <input type="text" id="ciudad" placeholder="Ciudad" value="Madrid">
        <textarea id="direccion" placeholder="Dirección">Calle Test 123</textarea>
        <input type="number" id="cantidad" value="30" min="30">
        <select id="tamaño">
            <option value="Pequeño">Pequeño</option>
            <option value="Mediano">Mediano</option>
            <option value="Grande">Grande</option>
        </select>
        <select id="estilo">
            <option value="Realista">Realista</option>
            <option value="Estilizado">Estilizado</option>
            <option value="Minimalista">Minimalista</option>
        </select>
        <select id="forma">
            <option value="round">Redondo</option>
            <option value="rectangular">Rectangular</option>
            <option value="pill">Píldora</option>
            <option value="silhouette">Silueta</option>
        </select>
        <select id="color">
            <option value="Negro">Negro</option>
            <option value="Blanco">Blanco</option>
            <option value="Gris">Gris</option>
        </select>
        <textarea id="notasPedido" placeholder="Notas">Pedido de prueba</textarea>
        <input type="checkbox" id="newsletter" checked>
        <button type="submit">Crear Pedido de Prueba</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        // Función helper
        const $ = (id) => document.getElementById(id);
        
        // Funciones del pedido
        function generatePedidoId() {
            const timestamp = Date.now();
            const random = Math.floor(Math.random() * 1000);
            return `P${timestamp}${random}`;
        }
        
        function calculatePrice() {
            const cantidad = parseInt($('cantidad').value);
            const precioBase = 1.20;
            const iva = 0.21;
            const precioSinIva = cantidad * precioBase;
            const precioConIva = precioSinIva * (1 + iva);
            return parseFloat(precioConIva.toFixed(2));
        }
        
        function savePedidoToLocalStorage(pedidoData) {
            let pedidos = JSON.parse(localStorage.getItem('llavero3d_pedidos') || '[]');
            pedidos.push(pedidoData);
            localStorage.setItem('llavero3d_pedidos', JSON.stringify(pedidos));
            console.log('Pedido guardado en localStorage:', pedidoData);
            console.log('Total de pedidos:', pedidos.length);
            return pedidos;
        }
        
        // Manejar el formulario
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const pedidoData = {
                id: generatePedidoId(),
                fecha: new Date().toISOString(),
                nombre: $('nombre').value,
                email: $('email').value,
                telefono: $('telefono').value,
                ciudad: $('ciudad').value,
                direccion: $('direccion').value,
                cantidad: parseInt($('cantidad').value),
                tamaño: $('tamaño').value,
                estilo: $('estilo').value,
                forma: $('forma').value,
                color: $('color').value,
                notasPedido: $('notasPedido').value,
                newsletter: $('newsletter').checked,
                imagen: null,
                precio: calculatePrice(),
                estado: 'Nuevo'
            };
            
            const pedidos = savePedidoToLocalStorage(pedidoData);
            
            document.getElementById('result').innerHTML = `
                <h3>Pedido creado exitosamente!</h3>
                <p><strong>ID:</strong> ${pedidoData.id}</p>
                <p><strong>Nombre:</strong> ${pedidoData.nombre}</p>
                <p><strong>Precio:</strong> ${pedidoData.precio}€</p>
                <p><strong>Total de pedidos en localStorage:</strong> ${pedidos.length}</p>
                <p><strong>Datos en localStorage:</strong></p>
                <pre>${JSON.stringify(pedidos, null, 2)}</pre>
            `;
        });
        
        // Mostrar pedidos existentes
        function showExistingPedidos() {
            const pedidos = JSON.parse(localStorage.getItem('llavero3d_pedidos') || '[]');
            console.log('Pedidos existentes:', pedidos);
            return pedidos;
        }
        
        // Mostrar al cargar la página
        window.addEventListener('load', function() {
            const pedidos = showExistingPedidos();
            if (pedidos.length > 0) {
                document.getElementById('result').innerHTML = `
                    <h3>Pedidos existentes (${pedidos.length}):</h3>
                    <pre>${JSON.stringify(pedidos, null, 2)}</pre>
                `;
            }
        });
    </script>
</body>
</html>
